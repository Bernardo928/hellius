[package]
name = "hellius-core"
version = "0.3.0"
description = "Núcleo do Hellius: validação, metadados de binários e contrato do engine"
edition = "2021"
rust-version = "1.77"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
sha2 = "0.10"
goblin = "0.10"
capstone = "0.14"
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
