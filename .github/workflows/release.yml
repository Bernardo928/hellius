# Gera o release para Windows e Linux quando uma tag v* é enviada.
# GUI: instaladores Tauri (Windows: .msi e .exe NSIS; Linux: .AppImage, .deb, .rpm).
# Terminal: binário hellius-tui para cada sistema.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - run: npm ci

      - name: Verificações
        run: |
          npm run typecheck
          npm run lint
          npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Hellius ${{ github.ref_name }}'
          releaseBody: |
            Primeira versão de demonstração do Hellius.

            **Atenção:** o engine ainda é de demonstração. Os metadados do arquivo (formato, arquitetura, seções, SHA-256) são reais; funções e código exibidos são exemplos, e o app avisa isso o tempo todo. O arquivo analisado nunca é executado e o app não faz chamadas de rede.

            **GUI**
            - Windows: `Hellius_*_x64-setup.exe` (instalador) ou `Hellius_*_x64_en-US.msi`.
            - Linux: `Hellius_*_amd64.AppImage` (portátil), `.deb` ou `.rpm`.

            **Terminal** (sem interface gráfica)
            - `hellius-tui-windows-x64.exe` e `hellius-tui-linux-x64`.

            Os binários não são assinados: no Windows, o SmartScreen pode pedir confirmação.
          releaseDraft: false
          prerelease: true

  tui:
    needs: gui
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            binary: target/release/hellius-tui
            asset: hellius-tui-linux-x64
          - platform: windows-latest
            binary: target/release/hellius-tui.exe
            asset: hellius-tui-windows-x64.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Compilar e testar
        run: |
          cargo test -p hellius-core -p hellius-tui
          cargo build -p hellius-tui --release
      - name: Renomear binário
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.asset }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.asset }}
