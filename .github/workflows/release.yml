# Anexa os binários de Windows e Linux a um release quando ele é publicado no GitHub.
# GUI: instaladores Tauri (Windows: .msi e .exe NSIS; Linux: .AppImage, .deb, .rpm).
# Terminal: binário hellius-tui para cada sistema.
name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - run: npm ci

      - name: Verificações
        run: |
          npm run typecheck
          npm run lint
          npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Envia para o release que disparou o workflow.
          releaseId: ${{ github.event.release.id }}

  tui:
    needs: gui
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            binary: target/release/hellius-tui
            asset: hellius-tui-linux-x64
          - platform: windows-latest
            binary: target/release/hellius-tui.exe
            asset: hellius-tui-windows-x64.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Compilar e testar
        run: |
          cargo test -p hellius-core -p hellius-tui
          cargo build -p hellius-tui --release
      - name: Renomear binário
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.asset }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ matrix.asset }}
